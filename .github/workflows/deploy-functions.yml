name: Deploy Edge Functions

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'

jobs:
  # A publicação só acontece se testes e tipos passarem no mesmo commit.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:run

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.108.0

      - name: Deploy Edge Functions
        run: |
          set -e
          # Functions que devem ser publicas (sem verificacao de JWT do gateway),
          # pois sao chamadas por cron externo (cron-job.org) usando header proprio (x-cron-secret).
          NO_VERIFY_JWT_FUNCS=("collect-snapshots" "consolidate-daily")

          for func in supabase/functions/*/; do
            func_name=$(basename "$func")
            if [[ "$func_name" == _* ]]; then
              echo "Skipping shared folder $func_name..."
              continue
            fi

            extra_flags=""
            for no_verify_func in "${NO_VERIFY_JWT_FUNCS[@]}"; do
              if [[ "$func_name" == "$no_verify_func" ]]; then
                extra_flags="--no-verify-jwt"
                break
              fi
            done

            echo "Deploying $func_name (flags: $extra_flags)..."
            supabase functions deploy "$func_name" --project-ref ${{ secrets.SUPABASE_PROJECT_ID }} $extra_flags
          done
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
