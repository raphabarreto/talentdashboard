name: Backup auto-teste

# Exercita TODO o fluxo do backup com dados 100% FICTÍCIOS e uma chave GPG descartável:
# validação, restauração em Postgres do Supabase (RLS/auth reais), criptografia, upload, verificação do upload,
# checagem "já existe backup do dia" e recuperação com a chave privada. Não usa secrets nem toca em produção.
on:
  pull_request:
    paths:
      - 'scripts/backup/**'
      - '.github/workflows/backup*.yml'
      - 'schema.sql'
      - 'supabase/migrations/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      BACKUP_DATE: selftest-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Iniciar Postgres descartável do Supabase
        run: bash scripts/backup/start-postgres.sh

      - name: Chave GPG descartável (só existe neste teste)
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg-test"; mkdir -m 700 "$GNUPGHOME"
          gpg --batch --passphrase '' --quick-generate-key "selftest <selftest@example.test>" ed25519 cert 1d
          FPR="$(gpg --list-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')"
          gpg --batch --passphrase '' --quick-add-key "$FPR" cv25519 encr 1d
          { echo 'BACKUP_GPG_PUBLIC_KEY<<EOF_KEY'; gpg --export --armor "$FPR"; echo 'EOF_KEY'; } >> "$GITHUB_ENV"

      - name: Dados fictícios
        run: node scripts/backup/fixture.mjs "$RUNNER_TEMP/backup.json"

      - name: Validar
        run: node scripts/backup/validate.mjs "$RUNNER_TEMP/backup.json"

      - name: Restaurar em Postgres do Supabase e conferir (RLS incluída)
        run: bash scripts/backup/restore-test.sh "$RUNNER_TEMP/backup.json"

      - name: Criptografar
        run: node scripts/backup/seal.mjs "$RUNNER_TEMP/backup.json" "$RUNNER_TEMP/out"

      - name: Enviar artifact (1 dia)
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: backup-${{ env.BACKUP_DATE }}
          path: ${{ runner.temp }}/out/
          retention-days: 1
          if-no-files-found: error
          compression-level: 0

      - name: Confirmar o upload
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          EXPECTED_NAME: backup-${{ env.BACKUP_DATE }}
        run: node scripts/backup/verify-upload.mjs

      - name: Checagem "já existe backup do dia" encontra o artifact íntegro
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: backup-${{ env.BACKUP_DATE }}
          ACCEPT_RUN_ID: ${{ github.run_id }}
          CHECK_OUTPUT: ${{ runner.temp }}/check.out
        run: |
          : > "$CHECK_OUTPUT"
          node scripts/backup/check-existing.mjs
          grep -qx 'exists=true' "$CHECK_OUTPUT"

      - name: Checagem rejeita execução ainda não concluída com sucesso
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: backup-${{ env.BACKUP_DATE }}
          CHECK_OUTPUT: ${{ runner.temp }}/check2.out
        run: |
          : > "$CHECK_OUTPUT"
          # sem ACCEPT_RUN_ID a execução em andamento não conta como concluída com sucesso => deve dizer "não existe"
          node scripts/backup/check-existing.mjs
          grep -qx 'exists=false' "$CHECK_OUTPUT"

      - name: Recuperar com a chave privada e comparar com o original
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg-test"
          gpg --batch --pinentry-mode loopback --passphrase '' -d "$RUNNER_TEMP/out/backup-$BACKUP_DATE.json.gpg" > "$RUNNER_TEMP/recovered.json"
          cmp "$RUNNER_TEMP/backup.json" "$RUNNER_TEMP/recovered.json" && echo "recuperação idêntica ao original"
