name: Backup Supabase

# Agendamento ATIVO (autorizado pelo dono): 06h e 18h de Brasília = 09:00 e 21:00 UTC. A checagem "já existe backup de hoje"
# garante no máximo um backup válido por dia; a execução manual continua disponível.
# Ver docs/BACKUP.md (limitações, recuperação, o que fica fora do backup).
on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Ignorar a checagem "já existe backup de hoje" e criar outro'
        type: boolean
        default: false
  schedule:
    - cron: '0 9 * * *'   # 06h Brasília
    - cron: '0 21 * * *'  # 18h Brasília

# Mínimo necessário: só ler o código. O backup vai para o repositório PRIVADO de backups com o BACKUPS_REPO_TOKEN
# (secret do ambiente "backup"); este workflow não publica artifacts no repositório público.
permissions:
  contents: read

concurrency:
  group: backup-supabase
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: backup # precisa do BACKUPS_REPO_TOKEN para consultar as Releases privadas
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Já existe um backup válido de hoje?
        id: check
        env:
          BACKUPS_REPO_TOKEN: ${{ secrets.BACKUPS_REPO_TOKEN }}
          BACKUPS_REPO: ${{ github.repository_owner }}/talentdashboard-backups
          BACKUP_GPG_PUBLIC_KEY: ${{ vars.BACKUP_GPG_PUBLIC_KEY }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$FORCE" = "true" ]; then echo "exists=false" >> "$GITHUB_OUTPUT"; echo "forçado: ignorando a checagem"; exit 0; fi
          node scripts/backup/check-existing.mjs

  backup:
    needs: check
    # Ambiente com a regra "somente ramo main": os tokens (Supabase e repositório de backups) ficam como secrets DESTE ambiente (ver docs/BACKUP.md).
    environment: backup
    if: needs.check.outputs.exists != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BACKUP_GPG_PUBLIC_KEY: ${{ vars.BACKUP_GPG_PUBLIC_KEY }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      PGHOST: 127.0.0.1
      PGPORT: '54329'
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - name: Trava - o backup só executa a partir da main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then echo "::error::o backup só roda a partir da main (ref: $GITHUB_REF)"; exit 1; fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Iniciar Postgres descartável do Supabase
        run: bash scripts/backup/start-postgres.sh

      - name: 0. Definir a data do backup (fuso de Brasília)
        id: date
        run: |
          D="$(node -e 'import("./scripts/backup/lib.mjs").then(m=>console.log(m.brasiliaDate()))')"
          echo "d=$D" >> "$GITHUB_OUTPUT"
          echo "BACKUP_DATE=$D" >> "$GITHUB_ENV"

      - name: 1. Ler as 6 tabelas (consulta única, somente leitura)
        env:
          SUPABASE_BACKUP_TOKEN: ${{ secrets.SUPABASE_BACKUP_TOKEN }}
        run: node scripts/backup/fetch.mjs "$RUNNER_TEMP/backup.json"

      - name: 2. Validar estrutura, contagens e relacionamentos
        run: node scripts/backup/validate.mjs "$RUNNER_TEMP/backup.json"

      - name: 3. Teste de restauração (Postgres descartável com as dependências reais do Supabase)
        run: bash scripts/backup/restore-test.sh "$RUNNER_TEMP/backup.json"

      - name: 4. Criptografar com a chave pública e gerar manifesto
        run: node scripts/backup/seal.mjs "$RUNNER_TEMP/backup.json" "$RUNNER_TEMP/out"

      - name: 5. Publicar na Release privada (rascunho, conferência de hash e só então publica)
        env:
          BACKUPS_REPO_TOKEN: ${{ secrets.BACKUPS_REPO_TOKEN }}
          BACKUPS_REPO: ${{ github.repository_owner }}/talentdashboard-backups
        run: node scripts/backup/publish-release.mjs "$RUNNER_TEMP/out"

      - name: Apagar o JSON em texto puro do disco do runner
        if: always()
        run: rm -f "$RUNNER_TEMP/backup.json"

      - name: Remover o contêiner de teste
        if: always()
        run: bash scripts/backup/stop-postgres.sh
