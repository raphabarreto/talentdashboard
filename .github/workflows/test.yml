name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Type check
      run: npm run typecheck

    - name: Run tests
      run: npm run test:run
      
    - name: Build
      run: npm run build

  # Aviso de dependências com vulnerabilidade alta/crítica. Não bloqueia o PR (um aviso novo de terceiros
  # não deve travar uma correção sem relação), mas fica visível no resultado do GitHub Actions.
  audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
    - run: npm audit --audit-level=high
